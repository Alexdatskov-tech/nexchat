<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>NexChat — Server</title>
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="assets/css/theme.css" />
</head>
<body>

  <div id="notFoundState" class="hidden" style="min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:1.5rem;">
    <div class="glass-panel" style="max-width:380px; padding:2rem; text-align:center;">
      <i class="fa-solid fa-triangle-exclamation" style="font-size:1.6rem; color:var(--warning); margin-bottom:0.8rem;"></i>
      <h3 class="display">Can't open this server</h3>
      <p style="color:var(--text-secondary); font-size:0.86rem; margin-top:0.4rem;">It doesn't exist, or you're not a member.</p>
      <a href="portal.html" class="btn btn-primary" style="margin-top:1.2rem; width:100%;">Back to your servers</a>
    </div>
  </div>

  <div id="appShell" class="server-shell hidden">
    <aside class="channel-rail glass-panel" id="channelRail">
      <div class="server-head">
        <a href="portal.html" class="back-btn" title="Back to servers"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="server-title">
          <div class="server-name" id="serverNameLabel">Loading…</div>
          <div class="server-sub" id="memberCountLabel"></div>
        </div>
        <button id="btnServerMenu" title="Server options"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        <div class="server-menu hidden" id="serverMenu">
          <button id="menuInvite"><i class="fa-solid fa-user-plus"></i> Invite people</button>
          <button id="menuSettings"><i class="fa-solid fa-gear"></i> Server settings</button>
        </div>
      </div>
      <div class="channel-list" id="channelList"></div>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <button id="btnMobileChannels" class="btn btn-ghost" style="display:none; padding:0.4rem 0.6rem;"><i class="fa-solid fa-bars"></i></button>
        <span class="channel-icon" id="channelIcon"><i class="fa-solid fa-hashtag"></i></span>
        <span class="channel-name-label" id="channelNameLabel">general</span>
        <span class="channel-topic hidden" id="channelTopicLabel"></span>
      </header>

      <div class="message-list" id="messageList"></div>
      <div class="channel-empty hidden" id="channelEmptyState">Pick a text channel to start chatting.</div>

      <div class="composer hidden" id="composer">
        <textarea id="composerInput" placeholder="Message" rows="1"></textarea>
        <button class="btn btn-primary" id="btnSend"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </main>
  </div>

  <!-- Invite modal -->
  <div class="modal-overlay hidden" id="inviteModal">
    <div class="glass-panel modal-box">
      <div class="modal-head">
        <h3 class="display">Invite people</h3>
        <button id="closeInviteModal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p style="font-size:0.85rem; color:var(--text-secondary);">Generate a code and share it — anyone with it can join.</p>
      <div class="invite-row" style="display:flex; gap:0.5rem;">
        <input id="inviteCodeOutput" type="text" readonly class="mono" placeholder="Click generate…" style="flex:1; background:rgba(0,0,0,0.25); border:1px solid var(--glass-border); border-radius:10px; padding:0.7rem 0.9rem; color:var(--text-primary);" />
        <button class="btn btn-ghost" id="btnCopyInvite" title="Copy"><i class="fa-regular fa-copy"></i></button>
      </div>
      <button class="btn btn-primary" id="btnGenerateInvite" style="width:100%;">Generate new code</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/server.js"></script>
</body>
</html>
