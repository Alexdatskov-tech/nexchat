<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexChat — Portal</title>
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="assets/css/theme.css" />
</head>
<body>

  <div class="orb-field"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>

  <header class="app-header">
    <div class="brand">
      <img src="assets/img/logo.svg" alt="" />
      <h1 class="display">NexChat</h1>
    </div>
    <div class="actions">
      <div class="user-chip" id="userChip">
        <div class="avatar-circle" id="userAvatar" style="width:26px;height:26px;font-size:0.75rem;">?</div>
        <span id="userLabel">…</span>
      </div>
      <button class="btn btn-ghost" id="btnSignOut" title="Sign out"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </div>
  </header>

  <main class="portal-main">
    <div class="portal-toolbar">
      <h2 class="display">Your servers</h2>
      <div class="actions">
        <button class="btn btn-ghost" id="btnOpenJoin"><i class="fa-solid fa-right-to-bracket"></i> Join a server</button>
        <button class="btn btn-primary" id="btnOpenCreate"><i class="fa-solid fa-plus"></i> Create server</button>
      </div>
    </div>

    <div id="loadingState" style="text-align:center; padding:3rem; color:var(--text-muted);">
      <i class="fa-solid fa-circle-notch fa-spin" style="font-size:1.6rem;"></i>
    </div>

    <div id="emptyState" class="glass-panel empty-portal hidden">
      <i class="fa-solid fa-hexagon-nodes"></i>
      <h3 class="display">No servers yet</h3>
      <p>Create your own community or join one with an invite code.</p>
    </div>

    <div id="serverGrid" class="server-grid hidden"></div>
  </main>

  <!-- Create Server modal -->
  <div class="modal-overlay hidden" id="createModal">
    <div class="glass-panel modal-box">
      <div class="modal-head">
        <h3 class="display">Create a server</h3>
        <button id="closeCreateModal"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="icon-upload-row">
        <div class="icon-preview" id="createIconPreview"><i class="fa-solid fa-image"></i></div>
        <div class="field" style="flex:1;">
          <label for="createIconInput">Server icon (optional)</label>
          <input id="createIconInput" type="file" accept="image/*" />
        </div>
      </div>

      <div class="field">
        <label for="createNameInput">Server name</label>
        <input id="createNameInput" type="text" maxlength="100" placeholder="e.g. Late Night Coders ☕" />
      </div>
      <div class="field">
        <label for="createDescInput">Description (optional)</label>
        <textarea id="createDescInput" rows="2" placeholder="What's this server about?"></textarea>
      </div>
      <p class="error" id="createError"></p>
      <button class="btn btn-primary" id="btnSubmitCreate" style="width:100%;">Create server</button>
    </div>
  </div>

  <!-- Join Server modal -->
  <div class="modal-overlay hidden" id="joinModal">
    <div class="glass-panel modal-box">
      <div class="modal-head">
        <h3 class="display">Join a server</h3>
        <button id="closeJoinModal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="field">
        <label for="joinCodeInput">Invite code</label>
        <input id="joinCodeInput" type="text" placeholder="e.g. a1b2c3d4" />
      </div>
      <p class="error" id="joinError"></p>
      <button class="btn btn-primary" id="btnSubmitJoin" style="width:100%;">Join server</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/portal.js"></script>
</body>
</html>
