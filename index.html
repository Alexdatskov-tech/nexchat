<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>NexChat — Sign in</title>
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg?v=26" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="assets/css/theme.css?v=26" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="assets/img/logo.svg?v=26" alt="" />
        <div style="text-align:center;">
          <h1>NexChat</h1>
          <p>Rooms, voices, and everyone you like.</p>
        </div>
      </div>

      <div class="surface" style="padding:22px;">
        <div class="segmented">
          <button id="tabIn" class="on" type="button">Sign in</button>
          <button id="tabUp" type="button">Create account</button>
        </div>

        <form id="formIn" class="auth-form">
          <div class="field">
            <label for="inUser">Username</label>
            <input id="inUser" type="text" autocomplete="username" placeholder="alexander" required />
          </div>
          <div class="field">
            <label for="inPass">Password</label>
            <input id="inPass" type="password" autocomplete="current-password" placeholder="••••••••" required />
          </div>
          <p class="err" id="errIn"></p>
          <button type="submit" id="btnIn" class="btn btn-primary">Sign in</button>
        </form>

        <form id="formUp" class="auth-form hidden">
          <div class="field">
            <label for="upUser">Username</label>
            <input id="upUser" type="text" autocomplete="username" placeholder="alexander" maxlength="32" required />
            <span class="hint">How people find and @mention you. Letters, numbers, underscores.</span>
            <p class="err" id="errUser"></p>
          </div>
          <div class="field">
            <label for="upPass">Password</label>
            <input id="upPass" type="password" autocomplete="new-password" placeholder="At least 8 characters" required />
          </div>
          <div class="field">
            <label for="upPass2">Confirm password</label>
            <input id="upPass2" type="password" autocomplete="new-password" placeholder="Type it again" required />
            <span class="hint">There's no email on file, so there's no password reset. Store it somewhere safe.</span>
          </div>
          <p class="err" id="errUp"></p>
          <button type="submit" id="btnUp" class="btn btn-primary">Create account</button>
        </form>
      </div>

      <p class="auth-foot">A hobby project. Be decent to each other.</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=26"></script>
  <script src="assets/js/supabase-client.js?v=26"></script>
  <script src="assets/js/ui.js?v=26"></script>
  <script src="assets/js/auth.js?v=26"></script>
</body>
</html>
